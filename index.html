(function() {
  const blockPage = () => {
    document.body.innerHTML = "<div style='background:#0f172a;color:#ef4444;height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;font-family:sans-serif;text-align:center;padding:20px'><h1>🚫 XAVFSIZLIK TIZIMI</h1><p style='color:#fff;font-size:18px'>Kodni tekshirish va nusxalash qat'iyan taqiqlangan!</p></div>";
    throw new Error("Security Block");
  };

  // 1. O'ng tugma, nusxalash va matn belgilashni bloklash
  document.addEventListener('contextmenu', e => e.preventDefault());
  document.addEventListener('copy', e => e.preventDefault());
  document.addEventListener('cut', e => e.preventDefault());
  document.addEventListener('selectstart', e => e.preventDefault());

  // 2. Barcha tezkor tugmalarni (Windows va Mac) bloklash
  document.addEventListener('keydown', e => {
    const key = e.key.toUpperCase();
    if (
      e.key === 'F12' ||
      (e.ctrlKey && e.shiftKey && ['I', 'J', 'C', 'K'].includes(key)) ||
      (e.ctrlKey && ['U', 'S', 'P'].includes(key)) ||
      (e.metaKey && e.altKey && ['I', 'J', 'C'].includes(key)) ||
      (e.metaKey && ['U', 'S'].includes(key))
    ) {
      e.preventDefault();
      e.stopPropagation();
      return false;
    }
  }, true);

  // 3. Console xabarlarini o'chirish
  const noop = () => {};
  ['log', 'warn', 'error', 'info', 'debug', 'table', 'dir'].forEach(m => {
    console[m] = noop;
  });

  // 4. Sichqoncha orqali menyudan DevTools ochilganini aniqlash (PC uchun)
  const isMobile = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent);
  setInterval(() => {
    if (!isMobile) {
      if (window.outerWidth - window.innerWidth > 160 || window.outerHeight - window.innerHeight > 160) {
        blockPage();
      }
    }
    // 5. Debugger tuzog'i (DevTools ochiq bo'lsa darhol ushlaydi)
    const t0 = performance.now();
    debugger;
    if (performance.now() - t0 > 100) {
      blockPage();
    }
  }, 800);
})();

var x,z,speed,steer,dist,coinN,earned,gap,phase='intro',tP,tC,hitCD,turning=false,turnT=0,turnD=1,turnTh=0,px,sirT=0,redOn=true,said,said2,blend=1,introFov=60,introPos=new THREE.Vector3(),introLook=new THREE.Vector3(),R1=[-21,0.9,-7.9,-0.9],R2=[-21.2,-3.4,-7.9,0.9],last=performance.now(),lastR=0;

// name
function hi(){show($('hello'),'Salom, '+P.name+'!',3);}
function nameOk(){var v=$('ni').value.trim().slice(0,16);if(!v){$('ni').focus();return;}P.name=v;save();nmOpen=false;$('nm').style.display='none';hi();ia();}
$('nok').onclick=nameOk;$('ni').addEventListener('keydown',function(e){if(e.key==='Enter')nameOk();});
if(P.name){$('nm').style.display='none';setTimeout(hi,400);}else setTimeout(function(){$('ni').focus();},200);

// shop
var tab=0,sel=P.car,pvc=null;
function pvMake(){if(pvM)scene.remove(pvM);pvM=build(sel,pvc!==null?pvc:colorOf(sel));pvM.position.set(5000,.15,0);scene.add(pvM);}
function openShop(){if(nmOpen)return;shopOpen=true;sel=P.car;tab=0;pvc=null;pvMake();SH.style.display='flex';shopR();}
function closeShop(){shopOpen=false;SH.style.display='none';if(pvM){scene.remove(pvM);pvM=null;}save();}
function upCost(id,i){var l=upl(id)[i];return l>=5?0:Math.round((400+CD[id].p*.1)*(l+1)*(i===2?1.2:1)/50)*50;}
function bar(v){return '<div class="bar"><i style="width:'+Math.round(Math.min(1,v)*100)+'%"></i></div>';}
function shopR(){
  var C=CD[sel],own=P.own[sel],h='<div class="tp"><b>$ '+P.money+'</b><span>';
  ['Mashinalar','Kuchaytirish','Rang'].forEach(function(n,i){h+='<button data-a="t" data-i="'+i+'"'+(tab===i?' class="on"':'')+'>'+n+'</button>';});
  h+='</span><button data-a="x">✕</button></div>';
  if(tab===0){
    h+='<div class="row">';
    IDS.forEach(function(id){var c=CD[id];h+='<div class="cd'+(id===sel?' s':'')+'" data-a="c" data-i="'+id+'"><b>'+c.n+'</b>Tezlik'+bar(c.top/130)+'Tezlanish'+bar(c.acc/2.3)+'Boshqaruv'+bar(c.hd/1.5)+'<div class="pr">'+(P.own[id]?(P.car===id?'✓ Tanlangan':'✓ Sizniki'):'$ '+c.p)+'</div></div>';});
    h+='</div><div class="act">'+(own?(P.car===sel?'<button disabled>✓ Tanlangan</button>':'<button class="go" data-a="use">Tanlash</button>'):'<button class="'+(P.money<C.p?'no':'go')+'" data-a="buy">Sotib olish $ '+C.p+'</button>')+'</div>';
  }else if(tab===1){
    h+='<div class="row" style="flex-direction:column;overflow-y:auto"><b>'+C.n+'</b>';
    if(!own)h+='<div>Avval mashinani sotib oling.</div>';
    else ['Dvigatel (tezlik)','Shinalar (boshqaruv)','Nitro (kuch va tiklanish)'].forEach(function(n,i){var l=upl(sel)[i];h+='<div class="ur"><span>'+n+'<br>'+'●'.repeat(l)+'○'.repeat(5-l)+'</span><button class="'+(l>=5?'':'go')+'" data-a="u" data-i="'+i+'"'+(l>=5?' disabled':'')+'>'+(l>=5?'MAX':'+ $ '+upCost(sel,i))+'</button></div>';});
    h+='</div>';
  }else{
    h+='<div class="sw2">';
    COLS.forEach(function(c){var cur=(pvc!==null?pvc:colorOf(sel))===c[0],ow=c[2]===0||P.cols[c[0]];h+='<div><button class="'+(cur?'on':'')+'" data-a="col" data-i="'+c[0]+'" style="background:#'+('000000'+c[0].toString(16)).slice(-6)+'"></button><small>'+(ow?c[1]:'$ '+c[2])+'</small></div>';});
    h+='</div>'+(own?'':'<div style="text-align:center">Rangni saqlash uchun mashinani sotib oling.</div>');
  }
  SH.innerHTML=h;
}
SH.onclick=function(e){
  var t=e.target.closest('[data-a]');if(!t)return;var a=t.dataset.a,i=t.dataset.i,C=CD[sel];ia();
  if(a==='x')return closeShop();
  if(a==='t'){tab=+i;}
  else if(a==='c'){sel=i;pvc=null;pvMake();}
  else if(a==='use'){P.car=sel;setCar(sel);save();}
  else if(a==='buy'){if(P.money<C.p){show(praise,'Pul yetmaydi!',1.2);return;}P.money-=C.p;P.own[sel]=1;P.car=sel;setCar(sel);save();show(praise,'Sizniki!',1.4);}
  else if(a==='u'){var c=upCost(sel,+i);if(P.money<c){show(praise,'Pul yetmaydi!',1.2);return;}P.money-=c;upl(sel)[+i]++;save();show(praise,'Kuchaytirildi!',1.2);}
  else if(a==='col'){var hx=+i,cc=COLS.filter(function(q){return q[0]===hx;})[0];pvc=hx;
    if(P.own[sel]){if(cc[2]>0&&!P.cols[hx]){if(P.money<cc[2]){show(praise,'Pul yetmaydi!',1.2);pvMake();shopR();return;}P.money-=cc[2];P.cols[hx]=1;}
      P.ccol[sel]=hx;pvc=null;if(sel===P.car&&player.bm)player.bm.color.setHex(hx);save();}
    pvM.bm.color.setHex(hx);}
  shopR();
};
$('cart').onclick=openShop;

function spw(c,v,dt){c.w.forEach(function(w){w.rotation.x+=v*dt/.34;});}
function spawnAll(){
  traffic.forEach(function(t,i){placeCar(t,-70-i*20,false);t.m.visible=true;});
  groups.forEach(function(g,i){placeGroup(g,-40-i*55);});
}
function layout(){chunks.forEach(function(c,i){c.position.z=-i*CH;scatter(c);});}
function init(skip){
  x=-6;z=0;speed=0;steer=0;dist=0;coinN=0;earned=0;gap=16;tP=0;tC=0;hitCD=0;turning=false;turnTh=0;px=x;said=said2=false;blend=1;nit=100;boost=false;
  layout();
  inters.forEach(function(m,i){m.position.z=-500*(i+1);m.used=false;});
  traffic.forEach(function(t){t.m.visible=false;});
  groups.forEach(function(g){g.cs.forEach(function(m){m.visible=false;});});
  bank.visible=props.visible=true;bagC.visible=true;emp.visible=true;
  doors.forEach(function(d){d.rotation.y=0;});
  rob1.visible=rob2.visible=copL.visible=copR.visible=bagH.visible=false;gun.visible=true;
  over.hidden=true;siren.style.opacity=0;flash.style.opacity=0;
  if(skip){startPlay(true);}else{phase='intro';pc.visible=false;bagRoof.visible=false;rob1.visible=rob2.visible=true;}
}
function startPlay(fresh){
  phase='play';speed=16;gap=14;spawnAll();bagRoof.visible=true;rob1.visible=rob2.visible=false;pc.visible=true;pc.rotation.y=0;
  if(fresh){px=x;pc.position.set(x,0,z+gap);}else{px=pc.position.x;blend=0;}
  show(story,'Qoching!',1.6);
}
function reframe(){
  x=0;z=0;px=0;bank.visible=props.visible=false;emp.visible=false;
  layout();
  inters.forEach(function(m,i){m.position.z=-500*i;m.used=(i===0);});
  spawnAll();
}
function doTurn(d){turning=true;turnT=0;turnD=d;turnTh=0;}
function caught(){
  if(phase!=='play')return;
  phase='caught';speed=0;steer=0;tC=0;boost=false;
  pc.position.set(x,0,z+7);pc.rotation.y=0;
  copL.visible=copR.visible=true;save();
  $('fin').textContent='Politsiya ushladi! Masofa: '+(dist/1000).toFixed(2)+' km · Topilgan: $ '+earned+' · Hamyon: $ '+P.money;
}
$('again').addEventListener('click',function(){init(true);});
addEventListener('pagehide',save);
setTimeout(function(){hint.style.opacity=0;},9000);
function rot(vx,vz,a){return [vx*Math.cos(a)+vz*Math.sin(a),-vx*Math.sin(a)+vz*Math.cos(a)];}

function frame(now){
  requestAnimationFrame(frame);
  if(now-lastR<1000/ST.fps-1.5)return;lastR=now;
  var raw=Math.max(0,Math.min((now-last)/1000,0.05));last=now;
  var dt=(shopOpen||nmOpen)?0:raw;
  sirT+=raw;aud(dt);
  if(sirT>0.14){sirT=0;redOn=!redOn;plight.color.setHex(redOn?0xff0000:0x2040ff);mRed.color.setHex(redOn?0xff1010:0x300000);mBlue.color.setHex(redOn?0x000830:0x2a50ff);siren.style.setProperty('--sir',redOn?'rgba(255,0,0,.75)':'rgba(40,80,255,.75)');}
  if(shopOpen){
    pvT+=raw*.5;var rr=CD[sel].kind==='moto'?6.5:8.5;
    cam.fov=42;cam.updateProjectionMatrix();cam.position.set(5000+Math.sin(pvT)*rr,2.1,Math.cos(pvT)*rr);cam.lookAt(5000,-.9,0);
    if(pvM)pvM.w&&spw(pvM,6,raw);
    sun.target.position.set(5000,0,0);sun.position.set(5030,70,20);sun.target.updateMatrixWorld();
    $('co').textContent='$ '+P.money;renderer.render(scene,cam);return;
  }
  if(phase==='intro'){
    tP+=dt;
    if(!said&&tP>0.3){said=true;show(story,'Pullar qayerda?!',3);}
    if(!said2&&tP>4.4){said2=true;show(story,'Politsiya ko‘rib qoldi!',1.8);}
    var k=Math.max(0,Math.min(1,(tP-3.4)/2.5));
    pose(emp,-2.9,-2.9,0,0);emp.position.set(-25,0,-0.5);emp.rotation.y=Math.PI/2-0.2;
    if(k===0){
      rob1.position.set(-21,0,0.9);rob1.rotation.y=-1.87;pose(rob1,-1.5,0.1,0,0);
      rob2.position.set(-21.2,0,-3.4);rob2.rotation.y=-Math.PI/2;pose(rob2,-1.1+Math.sin(tP*7)*0.5,-0.5,0,0);
    }else{
      var s=Math.sin(tP*17);
      [[rob1,R1],[rob2,R2]].forEach(function(p){
        var f=p[0],r=p[1];
        f.position.set(r[0]+(r[2]-r[0])*k,0,r[1]+(r[3]-r[1])*k);f.rotation.y=Math.atan2(r[2]-r[0],r[3]-r[1]);
        pose(f,-s*0.8,s*0.8,s*0.9,-s*0.9);
      });
      rob2.arms[1].rotation.x=-0.2;
      bagC.visible=false;bagH.visible=true;
      if(k>=1){rob1.visible=rob2.visible=false;bagH.visible=false;bagRoof.visible=true;}
    }
    if(tP>2){pc.visible=true;pc.position.set(-2,0,Math.max(14,80-(tP-2)*15.3));pc.rotation.y=0;}
    var u=Math.max(0,Math.min(1,(tP-3.4)/1.2));u=u*u*(3-2*u);
    var f1=innerWidth<innerHeight?62:46;
    introFov=f1+(55-f1)*u;
    introPos.set(-9+13*u,2.2+1.3*u,-0.6-9.4*u);
    introLook.set(-22+13*u,1.6-0.1*u,-1.2+4.2*u);
    cam.position.copy(introPos);cam.lookAt(introLook);
    if(tP>6.3)startPlay(false);
  }else if(phase==='play'&&!turning){
    var C=CD[P.car],U=upl(P.car),pv=Math.min(41,34+dist/600)*(1+(C.top-75)/250);
    var topv=C.top*(1+.05*U[0]),bo=!!(Nit()&&nit>1&&speed>8);
    var target=Up()?topv:(Dn()?14:38);
    if(bo){target=Math.max(target,topv)+18+4*U[2];nit=Math.max(0,nit-24*dt);}else nit=Math.min(100,nit+(4+1.5*U[2])*dt);
    if(bo&&!boost)whoosh();boost=bo;
    speed+=(target-speed)*Math.min(1,dt*(Dn()?3:0.8*C.acc*(bo?2.2:1)));
    steer+=(((Rt()?1:0)-(Lf()?1:0))-steer)*Math.min(1,dt*8);
    x+=steer*dt*(8+speed*0.15)*C.hd*(1+.1*U[1]);
    if(x<-7.2){x=-7.2;speed*=0.995;}if(x>7.2){x=7.2;speed*=0.995;}
    z-=speed*dt;dist+=speed*dt;hitCD-=dt;
    gap+=(speed-pv)*dt*0.4;if(gap>16)gap=16;
    if(gap<=3.8)caught();

    var nextD=1e9;
    inters.forEach(function(m){
      var d=z-m.position.z;
      if(!m.used&&d>=0){nextD=Math.min(nextD,d);}
      if(!m.used&&d>=0&&d<14+speed*.2&&!turning&&(Lf()||Rt())){m.used=true;doTurn(Lf()?1:-1);}
      if(-d>30){m.position.z-=1500;m.used=false;}
    });
    warn.style.opacity=nextD<Math.max(110,speed*3)?1:0;

    if(hornReq){hornReq=false;honk();var tg=null;
      traffic.forEach(function(t){var d=z-t.z;if(d>4&&d<75&&Math.abs(t.x-x)<2.6&&t.nl<0&&(!tg||d<z-tg.z))tg=t;});
      if(tg){var cand=[tg.lane-1,tg.lane+1].filter(function(l){return l>=0&&l<4&&traffic.every(function(o){return o===tg||(o.lane!==l&&o.nl!==l)||Math.abs(o.z-tg.z)>28;});});
        if(cand.length){tg.nl=cand[Math.floor(Math.random()*cand.length)];tg.wait=1;}}
    }
    traffic.forEach(function(a){a.vv=a.v;});
    traffic.forEach(function(a){traffic.forEach(function(b){
      if(a!==b&&Math.abs(a.x-b.x)<2.4&&a.z>b.z&&a.z-b.z<16+(b.truck?4:0)&&a.vv>b.vv)a.vv=b.vv;
    });});
    traffic.forEach(function(t){
      if(t.nl>=0){t.wait-=dt;var bl=(Math.floor(now/250)%2)===0,dl=LX[t.nl]<LX[t.lane];indSet(t,dl&&bl,!dl&&bl);
        if(t.wait<=0){var tx=LX[t.nl],df=tx-t.x;t.x+=Math.sign(df)*Math.min(Math.abs(df),2.4*dt);if(Math.abs(tx-t.x)<0.02){t.x=tx;t.lane=t.nl;t.nl=-1;indSet(t,false,false);}}}
      t.z-=t.vv*dt;t.m.position.set(t.x,0,t.z);
      if(hitCD<=0&&Math.abs(t.x-x)<t.hw+C.hw&&Math.abs(t.z-z)<t.hl+C.hl){
        hitCD=1;thump();speed=Math.min(speed,10);gap-=10;show(story,'Urildingiz!',1.3);
        placeCar(t,z-(260+Math.random()*160),true);
      }
      if(t.z-z>40)placeCar(t,z-(260+Math.random()*160),true);
    });
    if(gap<=3.8)caught();

    groups.forEach(function(g){
      g.cs.forEach(function(m){
        m.rotation.y+=dt*3;
        if(m.visible&&Math.abs(m.position.z-z)<2.2&&Math.abs(m.position.x-x)<1.6){
          m.visible=false;coinN++;P.money+=5;earned+=5;nit=Math.min(100,nit+2);
          if(coinN%10===0){save();show(praise,WORDS[(coinN/10-1)%WORDS.length],1.3);}
        }
      });
      if(g.z-z>20){var mn=0;groups.forEach(function(o){mn=Math.min(mn,o.z);});placeGroup(g,mn-(45+Math.random()*40));}
    });
    px+=(x-px)*Math.min(1,dt*3);
    pc.position.set(px,0,z+gap);pc.rotation.y=-(x-px)*0.1;
    siren.style.opacity=Math.max(0,Math.min(0.9,(18-gap)/14));
  }else if(phase==='play'&&turning){
    turnT+=dt;boost=false;warn.style.opacity=0;
    var uu=Math.min(1,turnT/0.7);turnTh=turnD*uu*uu*(3-2*uu)*Math.PI/2;
    speed+=(26-speed)*Math.min(1,dt*4);
    x-=Math.sin(turnTh)*speed*dt;z-=Math.cos(turnTh)*speed*dt;dist+=speed*dt;
    pc.position.set(x+Math.sin(turnTh)*gap,0,z+Math.cos(turnTh)*gap);pc.rotation.y=turnTh;
    traffic.forEach(function(t){t.z-=t.vv*dt;t.m.position.set(t.x,0,t.z);});
    if(turnT>0.5)flash.style.opacity=1;
    if(turnT>0.8){reframe();flash.style.opacity=0;turning=false;turnTh=0;}
  }
  if(phase==='caught'){
    tC+=dt;
    var wk=Math.min(1,tC/2.4),sw=tC<2.4?Math.sin(tC*9)*0.6:0;
    copL.position.set(x-1.6-0.7*wk,0,z+6.6-6*wk);copR.position.set(x+1.6+0.7*wk,0,z+6.6-6*wk);
    copL.rotation.y=copR.rotation.y=Math.PI;
    pose(copL,-sw,sw,sw,-sw);pose(copR,sw,-sw,-sw,sw);
    var e=Math.max(0,Math.min(1,(tC-2.4)/0.8));
    if(doors.length){doors[0].rotation.y=-1.25*e;doors[1].rotation.y=1.25*e;}
    if(tC>3.1){
      var q=Math.min(1,(tC-3.1)/1.2);
      rob1.visible=rob2.visible=true;gun.visible=false;bagH.visible=false;
      rob1.position.set(x-0.5-1.9*q,0,z-0.3-0.6*q);rob2.position.set(x+0.5+1.9*q,0,z-0.3-0.6*q);
      rob1.rotation.y=rob2.rotation.y=0;
      pose(rob1,-2.9,-2.9,0,0);pose(rob2,-2.9,-2.9,0,0);
      pose(copL,-1.3,0,0,0);pose(copR,-1.3,0,0,0);
    }
    if(over.hidden&&tC>3.6)over.hidden=false;
    siren.style.opacity=0.55;
    cam.position.set(x+3.2,4.6,z+13.5);cam.lookAt(x-0.2,1.1,z-0.4);
  }else if(phase==='play'){
    var ca=turning?turnTh:0,o=rot(-x*0.3,13,ca),l=rot(-x*0.4,-14,ca);
    var Pp=new THREE.Vector3(x+o[0],5,z+o[1]),Qq=new THREE.Vector3(x+l[0],1.6,z+l[1]);
    if(blend<1){blend=Math.min(1,blend+dt/0.9);var e2=blend*blend*(3-2*blend);Pp.lerpVectors(introPos,Pp,e2);Qq.lerpVectors(introLook,Qq,e2);}
    cam.position.copy(Pp);cam.lookAt(Qq);
  }
  player.position.set(x,0,z);player.rotation.y=(turning?turnTh:0)-steer*0.25;spw(player,speed,dt);spw(pc,speed,dt);traffic.forEach(function(t){spw(t.m,t.vv,dt);});
  flame.visible=boost&&phase==='play';if(flame.visible)flame.scale.set(1,1,.8+Math.random()*.7);
  cam.fov=phase==='intro'?introFov:Math.min(80,60+speed*0.15+(boost?8:0));cam.updateProjectionMatrix();
  chunks.forEach(function(c){if(c.position.z-z>CH*0.8){c.position.z-=CH*N;scatter(c);}});
  sun.target.position.set(x,0,z-10);sun.position.set(x+30,70,z+10);sun.target.updateMatrixWorld();
  kmEl.textContent=(dist/1000).toFixed(2)+' km';coEl.textContent='$ '+P.money;spdEl.textContent=Math.round(speed*3.6)+' km/soat';nitEl.style.width=nit+'%';
  renderer.render(scene,cam);
}
init(false);
requestAnimationFrame(frame);
addEventListener('resize',function(){renderer.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();});
})();
  
</script>
</body>
</html>
